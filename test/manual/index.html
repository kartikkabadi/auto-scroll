<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Scroll — Manual Test (Long Page)</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.6;
        color: #222;
        background: #fff;
      }
      .section {
        min-height: 80vh;
        padding: 2rem;
        border-bottom: 4px solid #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 600;
      }
      .section:nth-child(odd) { background: #f3f4f6; }
      .section:nth-child(even) { background: #e5e7eb; }
      #counter {
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        background: #10b981;
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="counter">Scroll Y: <span id="scrollY">0</span></div>
    <div class="section" id="s1">Section 1</div>
    <div class="section" id="s2">Section 2</div>
    <div class="section" id="s3">Section 3</div>
    <div class="section" id="s4">Section 4</div>
    <div class="section" id="s5">Section 5</div>
    <div class="section" id="s6">Section 6</div>
    <div class="section" id="s7">Section 7</div>
    <div class="section" id="s8">Section 8</div>
    <div class="section" id="s9">Section 9</div>
    <div class="section" id="s10">Section 10</div>
    <script>
      function update() {
        document.getElementById('scrollY').textContent = Math.round(window.scrollY);
      }
      window.addEventListener('scroll', update, { passive: true });
      update();
    </script>
  </body>
</html>
