<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Scroll — Manual Test (Overflow Container)</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        color: #222;
        background: #f3f4f6;
        padding: 1rem;
      }
      p { margin: 0 0 1rem; }
      #container {
        height: 90vh;
        overflow: auto;
        border: 4px solid #2563eb;
        border-radius: 8px;
        background: #fff;
      }
      .section {
        min-height: 60vh;
        padding: 2rem;
        border-bottom: 2px solid #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: 600;
      }
      .section:nth-child(odd) { background: #f9fafb; }
      .section:nth-child(even) { background: #fff; }
      #counter {
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        background: #10b981;
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div id="counter">Container scrollTop: <span id="scrollTop">0</span></div>
    <p>This page is not scrollable; the large container below is. The Auto Scroll extension should scroll the container, not the document.</p>
    <div id="container">
      <div class="section" id="s1">Container Section 1</div>
      <div class="section" id="s2">Container Section 2</div>
      <div class="section" id="s3">Container Section 3</div>
      <div class="section" id="s4">Container Section 4</div>
      <div class="section" id="s5">Container Section 5</div>
      <div class="section" id="s6">Container Section 6</div>
    </div>
    <script>
      const container = document.getElementById('container');
      function update() {
        document.getElementById('scrollTop').textContent = Math.round(container.scrollTop);
      }
      container.addEventListener('scroll', update, { passive: true });
      update();
    </script>
  </body>
</html>
