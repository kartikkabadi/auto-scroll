<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto Scroll</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="icons/icon48.png" alt="" class="logo" width="24" height="24" />
      <h1>Auto Scroll</h1>
    </header>

    <div class="speed-control">
      <label class="speed-label" for="speed">
        Speed
        <span id="speedValue" class="speed-value">6</span>
      </label>
      <input
        id="speed"
        type="range"
        min="1"
        max="100"
        value="6"
        step="1"
        aria-label="Scroll speed"
      />
    </div>

    <div class="actions">
      <button id="toggle" type="button" class="primary" aria-pressed="false">Start</button>
      <button id="share" type="button" class="secondary">Share</button>
    </div>

    <p id="status" class="status" hidden></p>

    <p class="hint">Shortcut: Ctrl+Shift+S</p>

    <script src="popup.js"></script>
  </body>
</html>
