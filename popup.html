<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto Scroll</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Auto Scroll</h1>

    <label class="speed-label" for="speed">
      Speed
      <span id="speedValue">6</span>
    </label>
    <input
      id="speed"
      type="range"
      min="1"
      max="100"
      value="6"
      step="1"
    />

    <div class="actions">
      <button id="toggle" type="button" class="primary">Start</button>
    </div>

    <p id="status" class="status" hidden></p>

    <script src="popup.js"></script>
  </body>
</html>
